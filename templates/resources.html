{% extends "base.html" %}
{% block title %}资源迁移分析 - {{ subscription_id }}{% endblock %}
{% block content %}
<div class="container-fluid py-4 px-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2><i class="bi bi-diagram-3"></i> 资源迁移可行性分析</h2>
            <small class="text-muted">订阅: {{ subscription_id }}</small>
        </div>
        <div>
            <a href="/subscriptions" class="btn btn-outline-secondary me-2">
                <i class="bi bi-arrow-left"></i> 返回
            </a>
            <button id="btnExport" class="btn btn-success" disabled>
                <i class="bi bi-download"></i> 导出 CSV
            </button>
        </div>
    </div>

    <!-- Summary Cards -->
    <div class="row g-3 mb-4" id="summaryCards" style="display:none;">
        <div class="col-md-3">
            <div class="card border-0 shadow-sm text-center">
                <div class="card-body">
                    <h3 class="text-primary" id="totalCount">0</h3>
                    <small class="text-muted">总资源数</small>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm text-center">
                <div class="card-body">
                    <h3 class="text-success" id="movableCount">0</h3>
                    <small class="text-muted">可跨订阅迁移</small>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm text-center">
                <div class="card-body">
                    <h3 class="text-danger" id="notMovableCount">0</h3>
                    <small class="text-muted">不可跨订阅迁移</small>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm text-center">
                <div class="card-body">
                    <h3 class="text-secondary" id="unknownCount">0</h3>
                    <small class="text-muted">未知状态</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Filter -->
    <div class="row mb-3" id="filterRow" style="display:none;">
        <div class="col-md-4">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control" id="searchInput" placeholder="搜索资源名称或类型...">
            </div>
        </div>
        <div class="col-md-3">
            <select class="form-select" id="filterMove">
                <option value="all">全部状态</option>
                <option value="yes">可迁移</option>
                <option value="no">不可迁移</option>
                <option value="unknown">未知</option>
            </select>
        </div>
        <div class="col-md-3">
            <select class="form-select" id="filterRG">
                <option value="all">全部资源组</option>
            </select>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="text-center py-5">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
        <p class="mt-3 text-muted">正在获取资源列表并分析迁移能力，请稍候...</p>
    </div>

    <!-- Error -->
    <div id="errorMsg" class="alert alert-danger" style="display:none;"></div>

    <!-- Table -->
    <div class="table-container" id="tableContainer" style="display:none;">
        <table class="table table-striped table-hover align-middle" id="resourceTable">
            <thead class="table-dark sticky-top">
                <tr>
                    <th>#</th>
                    <th>资源名称</th>
                    <th>资源类型</th>
                    <th>位置</th>
                    <th>资源组</th>
                    <th>跨资源组迁移</th>
                    <th>跨订阅迁移</th>
                </tr>
            </thead>
            <tbody id="resourceBody"></tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const subscriptionId = "{{ subscription_id }}";
let allResources = [];

document.addEventListener('DOMContentLoaded', function() {
    fetchResources();
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('filterMove').addEventListener('change', applyFilters);
    document.getElementById('filterRG').addEventListener('change', applyFilters);
    document.getElementById('btnExport').addEventListener('click', exportCSV);
});

function fetchResources() {
    fetch(`/api/resources/${subscriptionId}`)
        .then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
        })
        .then(data => {
            if (data.error) throw new Error(data.error);
            allResources = data.resources;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('summaryCards').style.display = '';
            document.getElementById('filterRow').style.display = '';
            document.getElementById('tableContainer').style.display = '';
            document.getElementById('btnExport').disabled = false;
            updateSummary();
            populateRGFilter();
            renderTable(allResources);
        })
        .catch(err => {
            document.getElementById('loading').style.display = 'none';
            const el = document.getElementById('errorMsg');
            el.style.display = '';
            el.textContent = '加载失败: ' + err.message;
        });
}

function updateSummary() {
    document.getElementById('totalCount').textContent = allResources.length;
    document.getElementById('movableCount').textContent = allResources.filter(r => r.moveSubscription === 'Yes').length;
    document.getElementById('notMovableCount').textContent = allResources.filter(r => r.moveSubscription === 'No').length;
    document.getElementById('unknownCount').textContent = allResources.filter(r => r.moveSubscription === 'Unknown').length;
}

function populateRGFilter() {
    const rgs = [...new Set(allResources.map(r => r.resourceGroup))].sort();
    const sel = document.getElementById('filterRG');
    rgs.forEach(rg => {
        const opt = document.createElement('option');
        opt.value = rg;
        opt.textContent = rg;
        sel.appendChild(opt);
    });
}

function applyFilters() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const moveFilter = document.getElementById('filterMove').value;
    const rgFilter = document.getElementById('filterRG').value;

    let filtered = allResources.filter(r => {
        if (search && !r.name.toLowerCase().includes(search) && !r.type.toLowerCase().includes(search))
            return false;
        if (moveFilter === 'yes' && r.moveSubscription !== 'Yes') return false;
        if (moveFilter === 'no' && r.moveSubscription !== 'No') return false;
        if (moveFilter === 'unknown' && r.moveSubscription !== 'Unknown') return false;
        if (rgFilter !== 'all' && r.resourceGroup !== rgFilter) return false;
        return true;
    });
    renderTable(filtered);
}

function badge(val) {
    if (val === 'Yes') return '<span class="badge badge-yes">Yes</span>';
    if (val === 'No') return '<span class="badge badge-no">No</span>';
    return '<span class="badge badge-unknown">Unknown</span>';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(text));
    return div.innerHTML;
}

function renderTable(resources) {
    const tbody = document.getElementById('resourceBody');
    tbody.innerHTML = resources.map((r, i) =>
        `<tr>
            <td>${i + 1}</td>
            <td><strong>${escapeHtml(r.name)}</strong></td>
            <td><code>${escapeHtml(r.type)}</code></td>
            <td>${escapeHtml(r.location)}</td>
            <td>${escapeHtml(r.resourceGroup)}</td>
            <td>${badge(r.moveResourceGroup)}</td>
            <td>${badge(r.moveSubscription)}</td>
        </tr>`
    ).join('');
}

function exportCSV() {
    const BOM = '\uFEFF';
    let csv = BOM + '资源名称,资源类型,位置,资源组,跨资源组迁移,跨订阅迁移\n';
    allResources.forEach(r => {
        csv += `"${r.name}","${r.type}","${r.location}","${r.resourceGroup}","${r.moveResourceGroup}","${r.moveSubscription}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `azure-move-analysis-${subscriptionId}.csv`;
    link.click();
}
</script>
{% endblock %}
