<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Azure 资源迁移分析{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; }
        main { flex: 1; }
        .hero { background: linear-gradient(135deg, #0078d4 0%, #005a9e 100%); color: white; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.1); transition: all .2s; }
        .badge-yes { background-color: #198754; }
        .badge-no { background-color: #dc3545; }
        .badge-unknown { background-color: #6c757d; }
        .table-container { max-height: 70vh; overflow-y: auto; }
        .spinner-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-arrow-left-right"></i> Azure 资源迁移分析
            </a>
            <div class="navbar-nav ms-auto">
                {% if user %}
                <span class="nav-item nav-link text-light">
                    <i class="bi bi-person-circle"></i>
                    {{ user.get('preferred_username', user.get('name', '用户')) }}
                </span>
                <a class="nav-item nav-link" href="/logout"><i class="bi bi-box-arrow-right"></i> 退出</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-light text-center py-3 mt-4">
        <small class="text-muted">
            数据来源:
            <a href="https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-support-resources" target="_blank">Microsoft Docs - Move Support Resources</a>
        </small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
